[package]
name = "market-specs-parity"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Checks pubky-market-specs against the marketplace build of pubky-app-specs"

# Its own workspace and lockfile: pubky-app-specs depends on pubky 0.9 on
# native targets, which must never enter the published crate's dependency tree.
[workspace]

[dependencies]
pubky-market-specs = { path = ".." }
pubky-app-specs = { git = "https://github.com/BitcoinErrorLog/pubky-app-specs", rev = "5ef6e31e89530a58e66044a08fb6baf704adabc7" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base32 = "0.5.1"
blake3 = "1.8.5"
ed25519-dalek = "2"

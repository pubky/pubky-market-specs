[package]
name = "pubky-market-specs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Pubky Market commerce data formats: shops, listings, drops, reviews, receipts, watchlists and attestations, with validation and URI helpers"
readme = "README.md"
homepage = "https://pubky.app"
repository = "https://github.com/pubky/pubky-market-specs"
license = "MIT"
documentation = "https://docs.rs/pubky-market-specs"
keywords = ["pubky", "marketplace", "commerce", "nexus", "specs"]
exclude = [".github", "pkg", "parity", "src/bin"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
url = "2.5.8"
base32 = "0.5.1"
blake3 = "1.8.5"
# Attestation verification (EdDSA compact JWS, RFC 8037) and public key
# validation. The verifying key is the decoded pubky, so no JOSE stack is needed.
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
utoipa = { version = "5.5.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.77"

[features]
openapi = ["utoipa"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
